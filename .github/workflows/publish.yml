name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image version from tag (validated against package.json)
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          pkg_version="$(jq -r '.version' package.json)"
          if [ "$version" != "$pkg_version" ]; then
            echo "error: el tag '${REF_NAME}' (versión '${version}') no coincide con package.json#version ('${pkg_version}')." >&2
            echo "Tagueá la versión que dice package.json: git tag v${pkg_version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/jastorgalj/cortex:latest
            ghcr.io/jastorgalj/cortex:${{ steps.version.outputs.version }}
