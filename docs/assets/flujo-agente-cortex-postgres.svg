<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-label="Flujo: agente, MCP, Cortex, Prisma y PostgreSQL">
  <title>Flujo agente → Cortex → PostgreSQL</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7781"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="430" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>

  <text x="30" y="40" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">Cómo fluye una consulta</text>
  <text x="30" y="60" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">El agente pregunta por MCP; Cortex busca en PostgreSQL y le devuelve las notas.</text>

  <!-- caja 1 -->
  <rect x="28" y="86" width="150" height="96" rx="8" fill="#ffffff" stroke="#afb8c1" stroke-width="1"/>
  <text x="103" y="126" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Agente</text>
  <text x="103" y="148" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#59636e">Hermes · Claude Code</text>

  <!-- caja 2 -->
  <rect x="223" y="86" width="150" height="96" rx="8" fill="#ffffff" stroke="#afb8c1" stroke-width="1"/>
  <text x="298" y="126" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">MCP</text>
  <text x="298" y="148" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#59636e">HTTP streamable, /mcp</text>

  <!-- caja 3 -->
  <rect x="418" y="86" width="150" height="96" rx="8" fill="#eff5fd" stroke="#7aa2d4" stroke-width="1.5"/>
  <text x="493" y="126" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Cortex</text>
  <text x="493" y="148" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#3b5b80">Elysia + Bun</text>

  <!-- caja 4 -->
  <rect x="613" y="86" width="150" height="96" rx="8" fill="#ffffff" stroke="#afb8c1" stroke-width="1"/>
  <text x="688" y="126" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Prisma</text>
  <text x="688" y="148" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#59636e">modelo y migraciones</text>

  <!-- caja 5 -->
  <rect x="808" y="86" width="150" height="96" rx="8" fill="#ffffff" stroke="#afb8c1" stroke-width="1"/>
  <text x="883" y="122" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">PostgreSQL 16</text>
  <text x="883" y="144" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#59636e">pgvector · 768 dim</text>
  <text x="883" y="162" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#59636e">texto en español</text>

  <!-- flechas -->
  <line x1="180" y1="134" x2="216" y2="134" stroke="#6e7781" stroke-width="1.8" marker-end="url(#flecha)"/>
  <line x1="375" y1="134" x2="411" y2="134" stroke="#6e7781" stroke-width="1.8" marker-end="url(#flecha)"/>
  <line x1="570" y1="134" x2="606" y2="134" stroke="#6e7781" stroke-width="1.8" marker-end="url(#flecha)"/>
  <line x1="765" y1="134" x2="801" y2="134" stroke="#6e7781" stroke-width="1.8" marker-end="url(#flecha)"/>

  <!-- conector Cortex -> superficies de lectura -->
  <path d="M493 182 V206 H744 V231" fill="none" stroke="#7aa2d4" stroke-width="1.6" marker-end="url(#flecha)"/>

  <!-- panel izquierdo: escritura -->
  <rect x="28" y="232" width="470" height="160" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="262" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Solo /mcp escribe</text>
  <text x="52" y="290" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#3d444d">La API REST y la vista web son de lectura:</text>
  <text x="52" y="310" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#3d444d">cualquier escritura fuera de /mcp responde 405.</text>
  <text x="52" y="340" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#3d444d">Búsqueda híbrida: texto completo en español</text>
  <text x="52" y="360" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#3d444d">+ similitud por coseno, fusionados con RRF.</text>

  <!-- panel derecho: superficies de lectura -->
  <rect x="530" y="232" width="428" height="160" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="554" y="262" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Superficies de lectura</text>

  <text x="554" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">GET /  ·  GET /health</text>
  <text x="740" y="294" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">vista web y healthcheck</text>

  <text x="554" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">GET /api/search</text>
  <text x="740" y="326" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">búsqueda por q, app, kind</text>

  <text x="554" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">GET /api/notes/:id</text>
  <text x="740" y="358" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">una nota completa</text>
</svg>
