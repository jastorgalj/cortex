[test]
timeout = 300000
preload = ["./test/preload.ts"]

[test.env]
# DB de test separada — los tests NUNCA tocan `cortex` (la DB principal) ni la base del .env.
# preload.ts NO lee el .env: usa el Postgres local fijo y crea/migra `cortex_test`.
# Esta variable sobrescribe DATABASE_URL en los workers de test (complementa preload).
DATABASE_URL = "postgresql://cortex:knowledge_dev@127.0.0.1:5433/cortex_test"
